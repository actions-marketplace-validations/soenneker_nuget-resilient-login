name: "NuGet Resilient Login"
description: "Authenticate to NuGet.org with GitHub OIDC, bounded retries, request timeouts, and masked credentials."
author: 'soenneker'
branding:
  icon: "log-in"
  color: "blue"
inputs:
  user:
    description: NuGet.org username of the trusted publishing policy creator.
    required: true
  token-service-url:
    description: HTTPS token exchange endpoint, matching NuGet/login.
    default: 'https://www.nuget.org/api/v2/token'
  audience:
    description: OIDC audience, matching NuGet/login.
    default: 'https://www.nuget.org'
  log-responses:
    description: Log HTTP failure summaries, body-read status, sanitized JSON or plain-text error excerpts, and selected headers. Successful response bodies are never logged.
    default: 'true'
  max-retries:
    description: NuGet retries for transient failures (0-5). GitHub OIDC uses at most two retries, or this value when lower.
    default: '2'
  timeout-seconds:
    description: Initial NuGet HTTP attempt timeout including its response body (1-600 seconds). Doubles on each retry up to 600 seconds per attempt. Defaults to 60 seconds. No overall login deadline.
    default: '60'
outputs:
  NUGET_API_KEY:
    description: Masked, short-lived NuGet.org API key for use in subsequent steps of the same job.
runs:
  using: node24
  main: src/index.js
