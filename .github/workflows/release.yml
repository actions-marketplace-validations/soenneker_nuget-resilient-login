name: Draft Marketplace release
on:
  workflow_dispatch:
    inputs:
      version:
        description: New immutable release tag (for example v1.0.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: marketplace-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run check
      - run: npm test
      - name: Create tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Version must be vMAJOR.MINOR.PATCH'; exit 1; }
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" --verify-tag --draft --title "$VERSION" --generate-notes
